<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — Crestline Design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Playfair+Display:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/layout.js"></script>
  </head>
  <body>
    <site-header></site-header>

    <main class="page">
      <div class="contact-layout">
        <aside class="contact-card">
          <h1>Get in touch</h1>
          <p>
            If you’re interested in working together on a residential interior design project, please fill out the inquiry form below so I can learn more about your home.
          </p>
        </aside>

        <form class="contact-form" action="https://api.web3forms.com/submit" method="post">
          <input type="hidden" name="access_key" value="4f3761c3-a726-4fc9-9fdc-78aa028d6f1f" />
          <input type="hidden" name="subject" value="New Contact Form Submission - Crestline Design" />
          <input type="checkbox" name="botcheck" class="hidden" tabindex="-1" autocomplete="off" />

          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />

          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" />

          <label for="project-address">Project address</label>
          <input id="project-address" name="project-address" type="text" autocomplete="street-address" />

          <label for="scope">Briefly describe your project or scope of work</label>
          <textarea id="scope" name="scope" required></textarea>

          <label for="timeline">What is your ideal start date or timeline</label>
          <input id="timeline" name="timeline" type="text" />

          <label for="budget">Do you have a budget in mind for the project</label>
          <input id="budget" name="budget" type="text" />

          <button class="btn" type="submit">Send message</button>
          <p class="form-success" hidden>Thanks! We’ll be in touch shortly.</p>
        </form>
      </div>
    </main>

    <site-footer></site-footer>
    <script src="js/nav.js"></script>
  </body>
</html>
